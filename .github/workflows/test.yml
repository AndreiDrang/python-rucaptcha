name: Tests

on:
  push:
    branches: ["master", "release"]
    paths:
      - '.github/workflows/test.yml'
      - 'src/**'
      - 'tests/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: ["master", "release"]
    paths:
      - '.github/workflows/test.yml'
      - 'src/**'
      - 'tests/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    - cron: "5 0 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUCAPTCHA_KEY: ${{ secrets.RUCAPTCHA_KEY }}
      DEATHBYCAPTCHA_KEY: ${{ secrets.DEATHBYCAPTCHA_KEY }}
      CC_TEST_REPORTER_ID: ${{ secrets.CODE_CLIMATE_COVERAGE_ID }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Test
        run: make tests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{github.workspace}}/coverage/coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage to Code Climate
        uses: paambaati/codeclimate-action@v9.0.0
        with:
          coverageLocations: >-
            ${{github.workspace}}/coverage/coverage.xml:coverage.py
