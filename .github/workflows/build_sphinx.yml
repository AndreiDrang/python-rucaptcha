name: Sphinx docs build

on:
  push:
    branches: ["master"]
    paths:
      - '.github/workflows/build_sphinx.yml'
      - 'src/**'
      - 'docs/**'
      - 'files/**'

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build docs
        run: make doc
